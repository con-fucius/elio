name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elio
          POSTGRES_PASSWORD: elio
          POSTGRES_DB: elio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elio -d elio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELIO_DATABASE_URL: postgresql+asyncpg://elio:elio@localhost:5432/elio
      ELIO_TEST_DATABASE_URL: postgresql+asyncpg://elio:elio@localhost:5432/elio
      ELIO_MIN_EXECUTION_SECONDS: "0"
      ELIO_MIN_EVIDENCE_BYTES: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Alembic
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest -q

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Env template present
        run: test -f ../api/.env.example
